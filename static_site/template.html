<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{DESCRIPTION}}">
    <title>{{TITLE}}</title>
    <link rel="canonical" href="{{CANONICAL}}">
    <link rel="stylesheet" href="{{STYLESHEET}}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{HOME_LINK}}">Amsterdam Court Finder</a>
      <nav aria-label="Main navigation">
        <a href="{{HOME_LINK}}"><span data-en="Directory" data-nl="Gids">Directory</span></a>
        <a href="{{ADVERTISE_LINK}}"><span data-en="Advertise" data-nl="Adverteren">Advertise</span></a>
        <a href="{{OWNERS_LINK}}"><span data-en="For club owners" data-nl="Voor clubs">For club owners</span></a>
        <a href="{{CHECKER_URL}}"><span data-en="Live availability" data-nl="Live beschikbaarheid">Live availability</span></a>
      </nav>
      <div class="language-switch" aria-label="Page language">
        <button type="button" data-language="en" aria-pressed="true">EN</button>
        <button type="button" data-language="nl" aria-pressed="false">NL</button>
      </div>
    </header>
    <main id="main">
      {{BODY}}
    </main>
    <footer class="site-footer">
      <a href="{{PRIVACY_LINK}}"><span data-en="Privacy &amp; data" data-nl="Privacy en gegevens">Privacy &amp; data</span></a>
      <span data-en="Availability and prices can change; confirm with the venue." data-nl="Beschikbaarheid en prijzen kunnen veranderen; bevestig ze bij de locatie.">Availability and prices can change; confirm with the venue.</span>
      <a href="mailto:info@amsterdamcourtfinder.nl"><span data-en="Contact" data-nl="Contact">Contact</span></a>
    </footer>
    <script src="{{SCRIPT}}" defer></script>
  </body>
</html>
